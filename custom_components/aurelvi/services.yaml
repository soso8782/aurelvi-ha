push_config:
  name: Push configuration
  description: Resend saved pages and states to the panel.
  fields:
    panel_id:
      name: Panel ID
      required: true
      example: nspanel-7tmv73
      selector:
        text: {}
wake:
  name: Wake panel
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
page:
  name: Show page
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    id:
      name: Studio page ID
      required: true
      selector:
        text: {}
screen:
  name: Set screen
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    action:
      name: Action
      required: true
      selector:
        select:
          options:
          - 'on'
          - 'off'
          - dim
    brightness:
      name: Brightness (0.05 to 1)
      selector:
        number:
          min: 0.05
          max: 1
          step: 0.05
start_timer:
  name: Start shutdown timer
  description: The timer is stored in Home Assistant and restored after a restart.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    entity_id:
      name: Device to turn off
      required: true
      selector:
        entity:
          domain:
          - fan
          - light
    seconds:
      name: Seconds
      required: true
      selector:
        number:
          min: 5
          max: 86400
          mode: box
cancel_timer:
  name: Cancel timer
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
notify:
  name: Panel notification
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    title:
      name: Title
      selector:
        text: {}
    message:
      name: Notification message
      selector:
        text:
          multiline: true
    priority:
      name: Priority
      selector:
        select:
          options:
          - normal
          - high
    timeoutS:
      name: Display duration in seconds (0 = unlimited)
      selector:
        number:
          min: 0
          max: 86400
          mode: box
    sound:
      name: Sound or HTTPS/HTTP URL
      description: ding, alarm_beep, alarm, alarmo, siren, or a sound URL.
      selector:
        text: {}
    level:
      name: Severity
      selector:
        select:
          options: [info, success, warning, error]
    icon:
      name: Icon
      selector:
        text: {}
    image:
      name: Image URL
      selector:
        text: {}
    speak:
      name: Spoken text
      description: Read aloud by the panel's speech engine.
      selector:
        text:
          multiline: true
    actions:
      name: Answer buttons
      description: 'Up to three buttons, e.g. [{"id": "yes", "label": "Yes", "on_press": {"service": "light.turn_on", "target": {"entity_id": "light.hall"}}}] or a plain list of words.'
      selector:
        object: {}
    id:
      name: Notification ID
      description: Reusing an ID replaces that notification; aurelvi.notify_clear can remove it.
      selector:
        text: {}
adb_command:
  name: ADB command
  description: Run a safe ADB command on the panel over the LAN. Works while the panel is offline in MQTT. Requires network debugging and a prior authorization (Studio Setup / Update).
  fields:
    panel_id:
      name: Panel ID
      required: true
      example: nspanel-7tmv73
      selector:
        text: {}
    operation:
      name: Operation
      required: true
      selector:
        select:
          options: [wake, power, back, home, launch, reboot, connect]
    host:
      name: Panel IP (optional)
      description: Overrides the stored address or the IP reported by the panel.
      selector:
        text: {}
    port:
      name: ADB port (optional)
      selector:
        number:
          min: 1
          max: 65535
          mode: box
screenshot:
  name: Take screenshot
  description: The panel's screenshot camera updates when the image arrives.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
set_alarm:
  name: Set alarm clock
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    enabled:
      name: Enabled
      required: true
      selector:
        boolean: {}
    hour:
      name: Hour
      required: true
      selector:
        number: {min: 0, max: 23, mode: box}
    minute:
      name: Minute
      required: true
      selector:
        number: {min: 0, max: 59, mode: box}
play_media:
  name: Play sound
  description: Play a bundled sound (ding, alarm_beep, alarm, alarmo, siren) or an HTTP(S) URL.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    url:
      name: URL
      selector:
        text: {}
    asset:
      name: Bundled sound
      selector:
        select:
          options: [ding, alarm_beep, alarm, alarmo, siren]
    volume:
      name: Volume
      selector:
        number: {min: 0, max: 1, step: 0.05}
stop_media:
  name: Stop sound
  description: Stops playback, including a ringing siren.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
notify_clear:
  name: Clear notification
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
    id:
      name: Notification ID
      description: Leave empty to clear every notification.
      selector:
        text: {}
ping:
  name: Ping panel
  description: Measures the MQTT round trip; returns rtt_ms and fires aurelvi_pong.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
refresh_info:
  name: Refresh information
  description: Ask the panel to publish its version, IP, Wi-Fi signal, memory and uptime now.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector:
        text: {}
discover:
  name: Discover panels
  description: Find every Aurelvi panel online on the MQTT broker, paired or not.
  fields:
    timeout:
      name: Wait (seconds)
      default: 2
      selector:
        number: {min: 1, max: 10, step: 0.5}
